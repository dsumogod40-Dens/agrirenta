<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#176b37" />
  <meta name="description" content="Find trusted farm equipment for rent with AgriRenta." />
  <title>AgriRenta — Farm Equipment Rental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Background video for log in / register screens. Usba ang src kung lain ang filename -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="images/harves.png" src="background%20video%20for%20firstpage.mp4"></video>
  <div class="bg-shade"></div>

  <div id="app"></div>
  <section id="notificationToast" class="notification-toast" role="status" aria-live="polite" hidden>
    <span class="notification-toast-icon" aria-hidden="true"><i class="bi bi-bell-fill"></i></span>
    <div class="notification-toast-copy">
      <b id="notificationToastTitle"></b>
      <p id="notificationToastDescription"></p>
      <button type="button" class="notification-toast-open" data-act="opennotification">View details</button>
    </div>
    <button type="button" class="notification-toast-close" data-act="closenotification" aria-label="Dismiss notification"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </section>
  <dialog id="gcashDemoNotice" class="gcash-demo-dialog" aria-labelledby="gcashDemoNoticeTitle">
    <span class="notification-toast-icon" aria-hidden="true"><i class="bi bi-info-circle-fill"></i></span>
    <div class="notification-toast-copy">
      <b id="gcashDemoNoticeTitle">GCash payment notice</b>
      <p>This GCash checkout is a simulation only. No real money will be transferred.</p>
    </div>
    <button type="button" class="notification-toast-close" data-act="closegcashnotice" aria-label="Close payment notice"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
